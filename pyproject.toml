[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "release-information"
version = "0.1.0"
description = "Pre-commit driven Markdown -> single-file HTML renderer for release notes / specs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kota Suzuki" }]
keywords = ["markdown", "html", "pre-commit", "release-notes", "spec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown>=3.5,<4",
    "pygments>=2.17,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
release-information = "release_information.cli:main"

[project.urls]
Homepage = "https://github.com/kou135/release-information"
Issues = "https://github.com/kou135/release-information/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/release_information"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# theme.py embeds verbatim CSS from minima for visual parity; long font-stack
# declarations must stay on a single line so we exempt that file from E501.
"src/release_information/core/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
